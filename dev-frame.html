<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>frame check</title>
<style>html,body{margin:0;background:#cfcfcf;display:flex;gap:10px;padding:8px;font:11px system-ui}
figure{margin:0}figcaption{padding:3px 0}iframe{border:1px solid #999;background:#fff;display:block}</style></head>
<body><figure><figcaption>1440 × 900</figcaption><iframe width="1440" height="900"></iframe></figure>
<figure><figcaption>390 × 844</figcaption><iframe width="390" height="844"></iframe></figure>
<script>document.querySelectorAll('iframe').forEach((f,i)=>{const p=new URLSearchParams(location.search);f.src='fitting.html?'+p.toString()+'&f='+i;});</script>
</body></html>
