<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e4d"><title>Selfit 2.0</title><meta name="description" content="사진과 실측으로 의류 샘플을 등록하고, 3D 모델에 입혀 사이즈와 보행을 확인하는 드레싱룸."><link rel="stylesheet" href="style.css"></head>
<body><header class="masthead"><div class="mast-inner"><a class="brand" href="./" aria-label="Selfit 2.0 홈"><span class="brand-mark" data-icon="brand"></span>Selfit 2.0</a><nav aria-label="주 메뉴"><button id="allNav" class="nav-on">드레싱룸</button><button id="ownNav">내 샘플</button></nav><button id="guide" class="guide"><i data-icon="book"></i><span>이용 가이드</span></button></div></header>
<main><div class="intro"><div><h1>Dressing <em>Room</em></h1><p>옷장에서 샘플을 골라 나만의 가상 피팅을 시작하세요.</p></div><button class="register primary" id="register"><i data-icon="plus"></i>샘플 등록</button></div>
<div class="workbench">
<section class="panel shelf" id="closet"><div class="panel-title"><h2><i data-icon="hanger"></i><span id="shelfName">샘플 옷장</span><small id="total">7</small></h2><button class="icon-button" id="searchToggle" aria-label="샘플 검색" title="샘플 검색" aria-expanded="false" data-icon="search"></button></div>
<div class="shelf-tools"><div class="filters" id="filters" aria-label="의류 분류"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="outer" aria-pressed="false">아우터</button><button data-filter="top" aria-pressed="false">상의</button><button data-filter="bottom" aria-pressed="false">하의</button></div><div id="searchBox" hidden><input id="search" type="search" placeholder="상품명, 브랜드, 품번 검색" aria-label="샘플 검색어"></div></div>
<div id="samples" class="samples" aria-label="피팅 가능한 샘플"></div></section>
<section class="panel fitting" id="fitting"><div class="panel-title fitting-head"><div class="fit-views"><h2><i data-icon="person"></i>피팅룸</h2><div class="view-tabs" role="group" aria-label="피팅룸 보기"><button id="dressedView" aria-pressed="true">착장</button><button id="bodyView" aria-pressed="false">3D 체형</button></div></div><div class="gender" aria-label="피팅 모델"><button data-model="female" aria-pressed="true">여성 모델</button><button data-model="male" aria-pressed="false">남성 모델</button></div></div>
<div id="stage"><img id="still" src="catalog/hoodie-female.webp" alt="아디다스 후드 집업 여성 착장 예시"><div id="liveScene"></div><div class="mode-chip"><i></i><span id="mode">착장 미리보기</span></div><div class="stage-tools"><button id="expand" data-icon="expand" aria-label="피팅룸 전체 화면" title="전체 화면"></button><div></div><button id="zoomIn" data-icon="plus" aria-label="확대" title="확대"></button><button id="zoomOut" data-icon="minus" aria-label="축소" title="축소"></button><button id="recenter" data-icon="focus" aria-label="기본 시점" title="기본 시점"></button></div>
<div class="stage-bar"><button id="fitPreview"><i data-icon="ruler"></i><span>실측 핏 보기</span></button><button id="play"><i data-icon="play"></i><span>보행 시뮬레이션</span></button><button id="rotate" class="rotate" aria-label="3D 회전 보기" title="3D 회전 보기" data-icon="orbit"></button></div><button id="settings" class="settings" aria-label="물리 환경 설정"><i data-icon="sliders"></i><span>환경 설정</span></button>
</div><section class="product"><div class="product-heading"><div><div class="product-id"><b id="brand">adidas</b><span></span><span id="sku">KC9315</span></div><h3 id="productName">후드 집업</h3></div><div class="detail-actions"><button class="size-chart" id="removeSample" hidden>샘플 삭제</button><button id="measureTable" class="size-chart"><i data-icon="ruler"></i>실측표</button></div></div><div class="colour"><i id="colourDot"></i><span id="colourName">블랙 / 크림화이트</span></div><div class="size-line"><span>사이즈</span><div id="sizes" aria-label="착용 사이즈"></div></div><div id="quickMeasures" class="quick-measures"></div>
<section id="fitReport" class="fit-report" aria-label="실측 핏 분석">
<div class="fit-title"><h4>실측 핏 분석</h4><button type="button" id="bodyInputs" class="size-chart">신체 치수 설정</button></div>
<div id="bodySummary" class="fit-model"></div><div id="fitNumbers" class="fit-numbers" aria-live="polite"></div>
<p id="fitHem" class="fit-model fit-hem"></p><div class="fit-actions"><button id="compareFit" type="button">사이즈 비교</button><button id="finishView" type="button" aria-pressed="false">소맷단·밑단 확대</button><button id="fitMethod" type="button">소재와 계산 근거</button></div>
</section></section>
</section></div></main>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialogTitle"></h2><button id="close" class="icon-button" aria-label="닫기" data-icon="close"></button></div><div id="dialogBody"></div></dialog><div id="notice" role="status" aria-live="polite"></div>
