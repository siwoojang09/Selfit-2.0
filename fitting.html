<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F7F4"><title>Selfit 2.0 — 드레싱룸</title><meta name="description" content="사진과 실측으로 의류 샘플을 등록하고, 3D 모델에 입혀 사이즈와 보행을 확인하는 드레싱룸."><link rel="stylesheet" href="style.css?v=2026-11-23b"></head>
<body>
<div class="app">
<header class="topbar"><a class="wordmark" href="./" aria-label="Selfit 2.0 홈">Selfit <b>2.0</b></a>
<nav class="mainnav" aria-label="주 메뉴"><button id="allNav" class="navlink nav-on">드레싱룸</button><button id="ownNav" class="navlink">내 샘플</button></nav>
<div class="topbar-right"><span class="tagline">Try it before you buy it</span><button id="guide" class="ghost-pill"><i data-icon="book"></i><span>이용 가이드</span></button></div></header>

<main class="shell">
<aside class="closet card" id="closet">
  <div class="closet-head"><div class="closet-brand"><span class="serif">Selfit <b>2.0</b></span><small>Dressing Room</small></div>
    <div class="closet-tools"><button class="round-icon" id="searchToggle" aria-label="샘플 검색" title="샘플 검색" aria-expanded="false" data-icon="search"></button><button class="round-icon" id="register" aria-label="샘플 등록" title="샘플 등록" data-icon="plus"></button></div>
  </div>
  <div class="searchbar" id="searchBox"><i data-icon="search"></i><input id="search" type="search" placeholder="상품, 브랜드, 품번으로 찾기" aria-label="샘플 검색어"></div>
  <div class="filters" id="filters" aria-label="의류 분류"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="outer" aria-pressed="false">아우터</button><button data-filter="top" aria-pressed="false">상의</button><button data-filter="bottom" aria-pressed="false">하의</button></div>
  <div class="brand-chips" id="brandChips" aria-label="브랜드 필터"></div>
  <div class="shelf-title"><span id="shelfName">샘플 옷장</span><small id="total">7</small></div>
  <div id="samples" class="samples" aria-label="피팅 가능한 샘플"></div>
  <div class="closet-foot"><span class="foot-note">실측으로 고른 나만의 옷장</span><button class="textlink" id="ownNavSmall">내가 등록한 샘플 보기</button></div>
</aside>

<section class="stage-shell" id="fitting" aria-label="3D 피팅룸">
  <div id="stage">
    <img id="still" src="catalog/hoodie-female.webp" alt="아디다스 후드 집업 여성 착장 예시">
    <div id="liveScene"></div>
    <div class="stage-top">
      <div class="view-tabs" role="group" aria-label="피팅룸 보기"><button id="dressedView" aria-pressed="true">착장</button><button id="bodyView" aria-pressed="false">3D 체형</button></div>
      <div class="gender" aria-label="피팅 모델"><button data-model="female" aria-pressed="true">여성</button><button data-model="male" aria-pressed="false">남성</button></div>
    </div>
    <div class="rail rail-left" aria-label="뷰 도구">
      <button class="rail-btn" id="expand" data-icon="expand" aria-label="피팅룸 전체 화면" title="전체 화면"></button>
      <button class="rail-btn" id="zoomIn" data-icon="plus" aria-label="확대" title="확대"></button>
      <button class="rail-btn" id="zoomOut" data-icon="minus" aria-label="축소" title="축소"></button>
      <button class="rail-btn" id="recenter" data-icon="focus" aria-label="기본 시점" title="기본 시점"></button>
      <button class="rail-btn" id="rotate" data-icon="photo" aria-label="정지 착장 예시로 돌아가기" title="정지 착장 예시로 돌아가기"></button>
      <button class="rail-btn" id="settings" data-icon="sliders" aria-label="물리 환경 설정" title="환경 설정"></button>
    </div>
    <div class="rail rail-right" id="wornRail" aria-label="지금 입은 아이템"></div>
    <div class="stage-bottom">
      <div class="stage-bar"><button id="play"><i data-icon="play"></i><span>보행 시뮬레이션</span></button><button id="finishView" class="stage-mini">소맷단·밑단</button></div>
      <div class="turntable"><span class="arc"></span><span>360°</span><span class="arc"></span></div>
      <div class="mode-chip"><i></i><span id="mode">3D 실측 핏</span></div>
    </div>
  </div>
</section>

<aside class="look">
  <section class="card look-card">
    <div class="card-head"><h2 class="serif">Your Look</h2><span class="dot-live" title="실시간 3D"></span></div>
    <div class="product-line"><div class="product-id"><b id="brand">adidas</b><span class="rule"></span><span id="sku">KC9315</span></div><h3 id="productName">후드 집업</h3><div class="colour"><i id="colourDot"></i><span id="colourName">블랙 / 크림화이트</span></div></div>
    <div class="worn-list" id="wornList"></div>
  </section>

  <section class="card fit-card">
    <div class="card-head"><h2 class="serif">Style &amp; Fit</h2><button class="mini-link" id="bodyInputs" type="button">신체 치수</button></div>
    <div id="fitReport" class="fit-report" aria-label="실측 핏 분석">
      <p id="bodySummary" class="fit-model"></p>
      <div id="fitNumbers" class="fit-numbers" aria-live="polite"></div>
      <p id="fitHem" class="fit-hem"></p>
      <div class="fit-actions"><button id="compareFit" type="button">사이즈 비교</button><button id="fitMethod" type="button">계산 근거</button></div>
    </div>
    <div class="size-block"><div class="size-head"><span>사이즈</span><small>실측 단면 기준</small></div><div id="sizes" aria-label="착용 사이즈"></div><div id="quickMeasures" class="quick-measures"></div></div>
    <button id="fitPreview" class="primary-pill">3D로 입어보기</button>
    <div class="secondary-row"><button id="measureTable" class="textlink"><i data-icon="ruler"></i>실측표 보기</button><button id="removeSample" class="textlink" hidden>샘플 삭제</button></div>
  </section>

  <section class="card rec-card">
    <div class="card-head"><h2 class="serif"><i data-icon="sparkle"></i>Recommended</h2><small class="muted">이 핏과 어울리는 샘플</small></div>
    <div id="recommended" class="rec-row"></div>
  </section>
</aside>
</main>
</div>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialogTitle"></h2><button id="close" class="icon-button" aria-label="닫기" data-icon="close"></button></div><div id="dialogBody"></div></dialog><div id="notice" role="status" aria-live="polite"></div>
<script src="engine.js?v=2026-11-23b"></script><script type="module" src="app.js?v=2026-11-23b"></script></body></html>
